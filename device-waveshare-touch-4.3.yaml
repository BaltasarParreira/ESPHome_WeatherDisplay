substitutions:
  font: "fonts/OpenSans-Medium.ttf"

esphome:
  name: weatherdisplay
  friendly_name: WeatherDisplay
  #platformio_options:
  #  board_build.arduino.memory_type: qio_opi   # --> Bal
  #  board_upload.maximum_ram_size: 524288   # --> Bal
  #  board_build.flash_mode: dio
  build_flags:
    - "-DCONFIG_LV_DISP_DEF_REFR_PERIOD=30" # Was 10
#      - "-DLV_DRAW_SW_SUPPORT_RGB565=1"
    - "-DCONFIG_COMPILER_OPTIMIZATION_PERF=y"
    - "-Wno-deprecated-declarations"
    - "-DBOARD_HAS_PSRAM"
    # New
    - "-DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y"
  min_version: "2025.8.0"   # --> Bal
  on_boot:
    priority: 800.0  # Runs early during framework hardware initialization
    then:
      # 1. Force Lisbon timezone
      - lambda: |-
          setenv("TZ", "WET0WEST-1,M3.5.0/1,M10.5.0/2", 1);
          tzset();
          ESP_LOGI("main", "Forced POSIX Lisbon timezone onto ESP-IDF backend");

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_LWIP_IPV6: "n"
      CONFIG_LWIP_SO_LINGER: "y"
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"
      CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH: "y"
      CONFIG_RINGBUF_PLACE_FUNCTIONS_INTO_FLASH: "y"      
      # 👇 Safely enables PSRAM mapping without overriding low-level CPU caching registers
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_BOOT_INIT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO # Was "DEBUG"
  logs:
    lvgl: WARN # Was "DEBUG"
    display: INFO # Was "DEBUG"
    app: INFO # Was "DEBUG"

json:

# -----------------------------------------------------
# CENTRAL HEATING LOCAL SETPOINT STATE
# -----------------------------------------------------
globals:
  # CH local setpoint
  - id: ch_local_setpoint
    type: float
    restore_value: false
    initial_value: '20.0'

  - id: ch_setpoint_pending
    type: bool
    restore_value: false
    initial_value: 'false'
    
  # DHW local setpoint
  - id: dhw_local_setpoint
    type: float
    restore_value: false
    initial_value: '48.0'

  - id: dhw_setpoint_pending
    type: bool
    restore_value: false
    initial_value: 'false'
#time:
#  - platform: sntp
#    id: sntp_time
    #timezone: "Europe/Lisbon"
    #timezone: "WET0WEST-1,M3.5.0/1,M10.5.0/2"

# -----------------------------
# BACKLIGHT (correct pin for Waveshare 4.3")
# -----------------------------
output:
  - platform: ledc
    pin: GPIO6
    id: backlight
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "backlight"
    output: backlight
    restore_mode: ALWAYS_ON
    # This block triggers every time HA or ESPHome turns the light on
    on_turn_on:
      then:
        - lvgl.page.show: 
            id: daily_page
            animation: FADE_IN
            time: 300ms
        - script.execute: backlight_watchdog

script:
  - id: backlight_watchdog
    mode: restart
    then:
      - light.turn_on: 
          id: lcd_backlight
          brightness: 1.00
      - delay: 2min
      - lvgl.page.show: 
          id: clock_page  # Target page ID to show
          animation: FADE_IN
          time: 500ms
      - script.execute: backlight_saver

  - id: backlight_saver
    mode: restart
    then:
      - if:
                condition:
                  lambda: |-
                    auto time_now = id(sntp_time).now();
                    int hour = time_now.hour;
                    
                    // Define your hour constraints here (e.g., between 22:00 and 06:00)
                    // This logic handles ranges that cross over midnight safely
                    int start_hour = 7; 
                    int end_hour = 3;
                    
                    if (start_hour > end_hour) {
                        return (hour >= start_hour || hour < end_hour);
                    } else {
                        return (hour >= start_hour && hour < end_hour);
                    }
                then:
                  - if:
                      condition:
                        # Returns true if 'clock_page' is the active screen
                        lambda: |-
                          return id(clock_page).is_showing();
                      then:
                        - light.turn_on:
                            id: lcd_backlight
                            brightness: !lambda |-
                              // If the Home Assistant entity shows below horizon, apply night dimming
                              if (id(ha_sun_state).state == "below_horizon") {
                                return 0.30; // 30% brightness for night
                              } else {
                                return 0.50; // 50% brightness for day
                              }
                      else:
                        - light.turn_on: lcd_backlight

                else:  
                  - if:
                      condition:
                        # Returns true if 'clock_page' is the active screen
                        lambda: |-
                          return id(clock_page).is_showing();
                      then:
                        - light.turn_off: lcd_backlight

  # -----------------------------------------------------
  # CH SETPOINT DEBOUNCED SEND
  # -----------------------------------------------------
  - id: send_ch_setpoint
    mode: restart
    then:
      - delay: 250ms

      - if:
          condition:
            api.connected:
          then:
            - homeassistant.service:
                service: climate.set_temperature
                data:
                  entity_id: climate.opentherm_gateway_central_heating
                  temperature: !lambda |-
                    return id(ch_local_setpoint);

      - delay: 750ms

      - lambda: |-
          id(ch_setpoint_pending) = false;

  # -----------------------------------------------------
  # DHW SETPOINT DEBOUNCED SEND
  # -----------------------------------------------------
  - id: send_dhw_setpoint
    mode: restart
    then:
      - delay: 250ms

      - if:
          condition:
            api.connected:
          then:
            - homeassistant.service:
                service: number.set_value
                data:
                  entity_id: number.opentherm_gateway_dhw_setpoint
                  value: !lambda |-
                    return id(dhw_local_setpoint);

      - delay: 750ms

      - lambda: |-
          id(dhw_setpoint_pending) = false;


ch422g:
  - id: ch422g_hub

i2c:
  id: i2c_bus
  sda: GPIO08
  scl: GPIO09
  scan: true
  frequency: 400kHz

# -----------------------------
# TOUCHSCREEN (GT911)
# -----------------------------
touchscreen:
  - platform: gt911
    id: my_touch
    display: tft_display
    i2c_id: i2c_bus
    interrupt_pin: GPIO4
    reset_pin:
        ch422g: ch422g_hub
        number: 1
        mode: OUTPUT
    on_touch:
      then:
        - script.execute: backlight_watchdog
#        - if:
#            condition:
#              light.is_on: lcd_backlight
#            then:
#              - lvgl.page.next:
#            else:
#              - lvgl.page.show: daily_page
#              - light.turn_on: lcd_backlight

        - if:
            condition:
              light.is_off: lcd_backlight
            then:
              - light.turn_on: lcd_backlight
              - lvgl.page.show: 
                  id: daily_page
                  animation: FADE_IN
                  time: 250ms     
            else:
              # CASE 2 — Backlight ON → check if we are on clock_page
              - if:
                  condition:
                    lambda: |-
                      #return lv_scr_act() == id(clock_page).obj;
                      return id(clock_page).is_showing();
                  then:
                    - lvgl.page.show: 
                        id: daily_page
                        animation: OVER_LEFT
                        time: 300ms
    
                  # CASE 3 — Backlight ON and NOT on clock_page → allow LVGL gestures
                  else:
                    - lambda: |- #'/* allow LVGL to process swipe + buttons */'
                        return;

# -----------------------------
# DISPLAY (OFFICIAL ESPHOME MODEL)
# -----------------------------
display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: tft_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    #pclk_frequency: 14MHZ # Was 16MHZ
    pclk_frequency: 16MHZ 
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    #hsync_back_porch: 30
    #hsync_front_porch: 210
    #hsync_pulse_width: 30
    #vsync_back_porch: 4
    #vsync_front_porch: 4
    #vsync_pulse_width: 4
    # 👇 Re-calculated tight timing constraints
    #hsync_back_porch: 40
    #hsync_front_porch: 40
    #hsync_pulse_width: 48
    #vsync_back_porch: 32
    #vsync_front_porch: 13
    #vsync_pulse_width: 3
    data_pins:
      red:
        - 1         #r3
        - 2         #r4
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7

# -----------------------------
# LVGL
# -----------------------------
lvgl:
#  buffer_size: 8%
  rotation: 180
  buffer_size: 20% # Was 14%
  update_interval: 16ms
  style_definitions:
    - id: clean_box
      border_width: 0
      outline_width: 0
      shadow_width: 0
      pad_all: 0
      # Force removal of residual lines
      border_opa: 0%
      outline_opa: 0%
      shadow_opa: 0%
#  byte_order: little_endian
#  color_depth: 16
#  color_format: RGB565
  touchscreens:
    - touchscreen_id: my_touch

  pages:
#    - id: home_page
#      widgets: !include pages/home.yaml
    - id: daily_page
      widgets: !include pages/daily800.yaml
      on_swipe_left:
          - lvgl.page.show:
              id: daily_page2
              animation: MOVE_LEFT
              time: 300ms

      on_swipe_right:
          - lvgl.page.show:
              id: hourly_page3
              animation: MOVE_RIGHT
              time: 300ms

    - id: daily_page2
      widgets: !include pages/2daily800.yaml
      on_swipe_left:
          - lvgl.page.show:
              id: hourly_page
              animation: MOVE_LEFT
              time: 300ms

      on_swipe_right:
          - lvgl.page.show:
              id: daily_page
              animation: MOVE_RIGHT
              time: 300ms

    - id: hourly_page
      widgets: !include pages/hourly800.yaml
      on_swipe_left:
          - lvgl.page.show:
              id: hourly_page2
              animation: MOVE_LEFT
              time: 300ms

      on_swipe_right:
          - lvgl.page.show:
              id: daily_page2
              animation: MOVE_RIGHT
              time: 300ms

    - id: hourly_page2
      widgets: !include pages/2hourly800.yaml
      on_swipe_left:
          - lvgl.page.show:
              id: hourly_page3
              animation: MOVE_LEFT
              time: 300ms

      on_swipe_right:
          - lvgl.page.show:
              id: hourly_page
              animation: MOVE_RIGHT
              time: 300ms

    - id: hourly_page3
      widgets: !include pages/3hourly800.yaml
      on_swipe_left:
          - lvgl.page.show:
              id: daily_page
              animation: MOVE_LEFT
              time: 300ms

      on_swipe_right:
          - lvgl.page.show:
              id: hourly_page2
              animation: MOVE_RIGHT
              time: 300ms

    - id: clock_page
      skip: true
      widgets: !include pages/clock800.yaml
    - id: ch_page
      widgets: !include pages/ch800.yaml
      skip: true

      on_load:
        then:
          # Restore setpoint position on arc
          - lvgl.arc.update:
              id: ch_arc
              value: !lambda |-
                float value = id(ch_local_setpoint);

                if (value < 15.0f) value = 15.0f;
                if (value > 30.0f) value = 30.0f;

                return static_cast<int>(
                  roundf(value * 2.0f)
                );

          # Restore setpoint text
          - lvgl.label.update:
              id: ch_setpoint_label
              text: !lambda |-
                char buf[16];
                snprintf(
                  buf,
                  sizeof(buf),
                  "%.1f°",
                  id(ch_local_setpoint)
                );
                return std::string(buf);

          # Restore HEAT/OFF colors from current HA climate state
          - if:
              condition:
                lambda: |-
                  std::string mode = id(ha_ch_mode).state;

                  std::transform(
                    mode.begin(),
                    mode.end(),
                    mode.begin(),
                    ::tolower
                  );

                  return mode == "heat";

              then:
                # HEAT
                - lvgl.arc.update:
                    id: ch_arc
                    indicator:
                      arc_color: 0xFF6F22
                    knob:
                      bg_color: 0xFF6F22
                      border_color: 0xFFFFFF

                - lvgl.label.update:
                    id: ch_setpoint_label
                    text_color: 0xFF6F22

                - lvgl.label.update:
                    id: lbl_ch_enable_text
                    text_color: 0xFF6F22

                - lvgl.label.update:
                    id: lbl_ch_disable_text
                    text_color: 0x292929

              else:
                # OFF
                - lvgl.arc.update:
                    id: ch_arc
                    indicator:
                      arc_color: 0x566275
                    knob:
                      bg_color: 0x8A93A3

                - lvgl.label.update:
                    id: ch_setpoint_label
                    text_color: 0x566275

                - lvgl.label.update:
                    id: lbl_ch_enable_text
                    text_color: 0x292929

                - lvgl.label.update:
                    id: lbl_ch_disable_text
                    text_color: 0xFF6F22
    - id: dhw_page
      widgets: !include pages/dhw800.yaml
      skip: true

      on_load:
        then:
          - lvgl.arc.update:
              id: dhw_arc
              value: !lambda |-
                float value = id(dhw_local_setpoint);

                if (value < 35.0f) value = 35.0f;
                if (value > 60.0f) value = 60.0f;

                return static_cast<int>(
                  roundf(value)
                );

          - lvgl.label.update:
              id: dhw_setpoint_label
              text: !lambda |-
                char buf[16];

                snprintf(
                  buf,
                  sizeof(buf),
                  "%.0f°",
                  id(dhw_local_setpoint)
                );

                return std::string(buf);

          - if:
              condition:
                lambda: |-
                  return id(ha_dhw_enable_state).state == "on";

              then:
                - lvgl.arc.update:
                    id: dhw_arc
                    indicator:
                      arc_color: 0x2095F6
                    knob:
                      bg_color: 0xFFFFFF

                - lvgl.label.update:
                    id: dhw_setpoint_label
                    text_color: 0x2095F6

                - lvgl.label.update:
                    id: lbl_dhw_enable_text
                    text_color: 0x2095F6

                - lvgl.label.update:
                    id: lbl_dhw_disable_text
                    text_color: 0x292929

              else:
                - lvgl.arc.update:
                    id: dhw_arc
                    indicator:
                      arc_color: 0x566275
                    knob:
                      bg_color: 0x8A93A3

                - lvgl.label.update:
                    id: dhw_setpoint_label
                    text_color: 0x566275

                - lvgl.label.update:
                    id: lbl_dhw_enable_text
                    text_color: 0x292929

                - lvgl.label.update:
                    id: lbl_dhw_disable_text
                    text_color: 0x2095F6

# -----------------------------
# REQUIRED DUMMY SWITCH
# -----------------------------
switch:
  - platform: homeassistant
    id: any_id
    entity_id: switch.any_id
    internal: true

packages:
  - !include data/fonts800.yaml
  - !include data/images800.yaml
#  - !include data/mappings.yaml
  - !include data/text_sensors800.yaml
  - !include data/times800.yaml
