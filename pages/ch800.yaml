    # -----------------------------------------------------
    # PAGE 2 — CH THERMOSTAT PAGE
    # -----------------------------------------------------
#    - id: ch_page
#      widgets:

        # -----------------------------------------------
        # MAIN CH CONTAINER
        # -----------------------------------------------
        - obj:
            width: 100%
            height: 100%
            bg_color: black
            bg_opa: 100%
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            widgets:

              # -----------------------------------------
              # ARC (centered)
              # -----------------------------------------
              - arc:
                  id: ch_arc
                  align: CENTER
                  x: 0
                  width: 420
                  height: 420
                  adjustable: false
                  value: 40
                  min_value: 30
                  max_value: 60
                  arc_width: 24
                  arc_color: 0x292929
                  border_width: 0
                  radius: 0

                  indicator:
                    arc_color: 0xFF6F22
                    arc_width: 24

                  knob:
                    bg_color: 0xFF6F22
                    bg_opa: 100%
                    border_width: 0

              # -----------------------------------------
              # CURRENT ROOM TEMPERATURE
              # -----------------------------------------
              - label:
                  id: ch_current_temp
                  align: CENTER
                  text: "--.-°"
                  y: -90
                  text_color: 0xFFFFFF
                  text_opa: 100%
                  text_font: font_roboto_82

              # -----------------------------------------
              # SETPOINT LABEL
              # -----------------------------------------
              - label:
                  id: ch_setpoint_label
                  align: CENTER
                  text: "--.-°"
                  text_font: montserrat_42
                  text_color: 0xFF6F22
                  y: 20

              - label:
                  id: ch_action_label
                  align: CENTER
                  y: 80
                  #text_font: montserrat_30
                  text: "--"
                  text_color: 0xFF6F22

              # -----------------------------------------------------
              # SETPOINT MINUS BUTTON
              # -----------------------------------------------------
              - button:
                  id: btn_ch_minus
                  align: CENTER
                  x: -300
                  y: 20
                  width: 80
                  height: 80
                  radius: 14
                  bg_color: 0x292929
                  bg_opa: 100%
                  border_width: 0
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "-"
                        text_font: montserrat_42
                        text_color: 0xFFFFFF
                  on_click:
                    then:
                      - if:
                          condition:
                            api.connected:
                          then:
                            - homeassistant.service:
                                service: climate.set_temperature
                                data:
                                  entity_id: climate.opentherm_gateway_central_heating
                                  temperature: !lambda |-
                                    float value = id(ha_ch_setpoint).state - 0.5f;
                                    if (value < 15.0f) value = 15.0f;
                                    return value;

              # -----------------------------------------------------
              # SETPOINT PLUS BUTTON
              # -----------------------------------------------------
              - button:
                  id: btn_ch_plus
                  align: CENTER
                  x: 300
                  y: 20
                  width: 80
                  height: 80
                  radius: 14
                  bg_color: 0x292929
                  bg_opa: 100%
                  border_width: 0
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "+"
                        text_font: montserrat_42
                        text_color: 0xFFFFFF
                  on_click:
                    then:
                      - if:
                          condition:
                            api.connected:
                          then:
                            - homeassistant.service:
                                service: climate.set_temperature
                                data:
                                  entity_id: climate.opentherm_gateway_central_heating
                                  temperature: !lambda |-
                                    float value = id(ha_ch_setpoint).state + 0.5f;
                                    if (value > 30.0f) value = 30.0f;
                                    return value;
       

              # -----------------------------------------------------
              # CH ENABLE BUTTON (HEAT / FIRE ICON - LEFT SIDE)
              # -----------------------------------------------------
              - button:
                  id: btn_ch_enable
                  align: CENTER
                  x: -60
                  y: 125
                  width: 70
                  height: 44
                  bg_opa: 0%
                  shadow_width: 0
                  widgets:
                    - label:
                        id: lbl_ch_enable_text
                        align: CENTER 
                        text: "\U000F0238"
                        text_font: icon_font_big
                        text_color: 2697513 # Default muted color
                        bg_opa: 0%        
                  on_click:
                    then:
                      - if:
                          condition:
                            api.connected:
                          then:
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: climate.opentherm_gateway_central_heating
                                  hvac_mode: "heat"

              # -----------------------------------------------------
              # CH DISABLE BUTTON (OFF ICON - RIGHT SIDE)
              # -----------------------------------------------------
              - button:
                  id: btn_ch_disable
                  align: CENTER
                  x: 60
                  y: 125
                  width: 70
                  height: 44
                  bg_opa: 0%
                  shadow_width: 0
                  widgets:
                    - label:
                        id: lbl_ch_disable_text
                        align: CENTER
                        text: "\U000F0425" 
                        text_font: icon_font_big
                        text_color: 2697513 # Default muted color
                        bg_opa: 0%        
                  on_click:
                    then:
                      - if:
                          condition:
                            api.connected:
                          then:
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: climate.opentherm_gateway_central_heating
                                  hvac_mode: "off"


              # -----------------------------------------------------
              # BOTTOM NAVIGATION BAR
              # -----------------------------------------------------
              - obj:
                  align: CENTER
                  x: 0
                  y: 190
                  width: 100%
                  height: 60
                  bg_color: black
                  bg_opa: transp
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                        
                    # 1. Central Heating Page Icon (Left Section)
                    - button:
                        id: ch_nav_ch_btn
                        align: LEFT_MID
                        x: 10%
                        y: 0
                        width: 60
                        height: 44
                        bg_opa: 0%
                        shadow_width: 0
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F1A45"
                              text_color: 0xFF6F22
                              text_font: icon_font_big

                    # 2. First Divider Line (33% Mark)
                    - label:
                        align: LEFT_MID
                        x: 33%
                        y: -2
                        text: "|"
                        text_color: 0x222C3E
                        text_font: montserrat_30

                    # 3. Home Page Icon (Right Section)
                    - button:
                        id: ch_nav_home_btn
                        align: CENTER
                        x: 0
                        y: 0
                        width: 60
                        height: 44
                        bg_opa: 0%
                        shadow_width: 0
                        on_click:
                          - lvgl.page.show:
                              id: daily_page
                              animation: FADE_IN
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F02DC"
                              text_color: 0x566275
                              text_font: icon_font_big
    
                    # 4. Second Divider Line (66% Mark)
                    - label:
                        align: LEFT_MID
                        x: 66%
                        y: -2
                        text: "|"
                        text_color: 0x222C3E
                        text_font: montserrat_30

                    # 5. Domestic Hot Water Page Icon (Center Section)
                    - button:
                        id: ch_nav_dhw_btn
                        align: RIGHT_MID
                        x: -10%
                        y: 0
                        width: 60
                        height: 44
                        bg_opa: 0%
                        shadow_width: 0
                        on_click:
                          - lvgl.page.show:
                              id: dhw_page
                              animation: FADE_IN
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F1B29" 
                              text_color: 0x566275
                              text_font: icon_font_big
